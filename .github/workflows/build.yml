name: Build MIRA PRIME APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk   # නැත්නම් /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest වල SDK එක දැනටමත් තියෙනවා — install කරන්න ඕනේ නම් මේ step එක:
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip bot files
        run: |
          unzip -o bot-files.zip -d node-on-android/app
        # උඹේ folder structure එකට අනුව path එක වෙනස් කරන්න

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          cd node-on-android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mira-prime-apk
          path: node-on-android/app/build/outputs/apk/debug/*.apk
