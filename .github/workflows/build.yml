name: Build MIRA PRIME APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Bot Files
        run: |
          ls -la
          for f in *.zip; do unzip -o "$f"; done
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Build Tools
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34"
          yes | sdkmanager --licenses
      - run: npm install
      - run: npm install -g node-on-android
      - run: node-on-android build --source . --output MIRA-PRIME.apk --build-tools $ANDROID_HOME/build-tools/34.0.0
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIRA-PRIME-APK
          path: MIRA-PRIME.apk
